<div class="page-header">
    <h2><i class="fa-solid fa-clipboard-user"></i> Gestão de Frequência</h2>
    <div style="display: flex; gap: 15px; align-items: center;">
        <label for="freq-disciplina" style="font-weight: 500;">Selecione a Disciplina:</label>
        <select id="freq-disciplina" class="form-group" style="margin-bottom: 0; min-width: 250px;">
            <!-- Dinâmico -->
        </select>
        
        <label for="freq-data" style="font-weight: 500;">Data:</label>
        <input type="date" id="freq-data" class="form-group" style="margin-bottom: 0;">
    </div>
</div>

<div class="table-container" id="freq-container" style="display: none;">
    <div style="padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);">
        <h3>Chamada de Alunos</h3>
        <a class="btn btn-secondary" href="#" target="_blank" rel="noopener" onclick="return Frequencia.gerarQRCode(event)"><i class="fa-solid fa-qrcode"></i> Gerar QR Code (Auto-Chamada)</a>
    </div>
    <table>
        <thead>
            <tr>
                <th>Matrícula</th>
                <th>Nome</th>
                <th style="text-align: center;">Presença</th>
                <th style="text-align: center;">Ausência</th>
                <th style="text-align: center;">Justificada</th>
            </tr>
        </thead>
        <tbody id="frequencia-tbody">
            <!-- Dinâmico -->
        </tbody>
    </table>
    <div style="padding: 15px; text-align: right; border-top: 1px solid var(--border-color);">
        <button class="btn btn-primary" onclick="Frequencia.salvarChamadaOral()">Salvar Chamada Oral</button>
    </div>
</div>

<div id="freq-empty-state" style="text-align: center; padding: 50px; color: var(--text-muted);">
    <i class="fa-solid fa-hand-pointer fa-3x" style="margin-bottom: 15px;"></i>
    <h3>Selecione uma disciplina e a data para gerenciar a frequência.</h3>
</div>
